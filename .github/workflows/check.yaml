on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"

      - name: "install modules"
        run: |
          caps --strict --ci
          caps verify --toolchain

      - name: "validate snapshot and entries"
        run: |
          set -euo pipefail
          calcit calcit.cirru edit format
          if ! git diff --exit-code --quiet -- calcit.cirru; then
            echo '::error file=calcit.cirru::Snapshot is not canonical. With Calcit 0.30.1, run calcit calcit.cirru edit format and inspect definitions through calcit query def.'
            exit 1
          fi
          calcit calcit.cirru --check-only --all-defs
          calcit calcit.cirru --entry server --check-only
          calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'

      - name: "smoke test HTTP runtime"
        run: |
          set -euo pipefail
          calcit calcit.cirru --entry server > "$RUNNER_TEMP/http-workflow-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..30}; do
            if curl --fail --silent --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:4000/json > "$RUNNER_TEMP/http-workflow-json.txt"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/http-workflow-server.log"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/http-workflow-server.log"
            exit 1
          fi

          grep --fixed-strings '"message": "a piece of json"' "$RUNNER_TEMP/http-workflow-json.txt"
          curl --fail --silent --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:4000/html > "$RUNNER_TEMP/http-workflow-html.txt"
          grep --fixed-strings '<title>Calcit HTTP Demo</title>' "$RUNNER_TEMP/http-workflow-html.txt"
          curl --fail --silent --connect-timeout 2 --max-time 5 --request POST \
            --header 'content-type: application/json' \
            --data '{"hello":"calcit","text":"中文🌱","flag":false,"count":0,"value":null}' \
            http://127.0.0.1:4000/post-json > "$RUNNER_TEMP/http-workflow-post-json.txt"
          jq -e '.["sent-data"] == {"hello":"calcit","text":"中文🌱","flag":false,"count":0,"value":null}' "$RUNNER_TEMP/http-workflow-post-json.txt"
