on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1

      - name: "install modules"
        run: |
          caps --strict --ci
          caps verify --toolchain

      - name: "validate snapshot and entries"
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry server --check-only
          calcit calcit.cirru analyze check-types --summary-only --format json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
          calcit calcit.cirru analyze deprecated --summary-only --format json

      - name: "smoke test HTTP runtime"
        run: |
          set -euo pipefail
          calcit calcit.cirru --entry server > "$RUNNER_TEMP/http-workflow-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/json > "$RUNNER_TEMP/http-workflow-json.txt"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/http-workflow-server.log"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/http-workflow-server.log"
            exit 1
          fi

          grep --fixed-strings '"message": "a piece of json"' "$RUNNER_TEMP/http-workflow-json.txt"
          curl --fail --silent http://127.0.0.1:4000/html > "$RUNNER_TEMP/http-workflow-html.txt"
          grep --fixed-strings '<title>Calcit HTTP Demo</title>' "$RUNNER_TEMP/http-workflow-html.txt"
          curl --fail --silent --request POST \
            --header 'content-type: application/json' \
            --data '{"hello":"calcit"}' \
            http://127.0.0.1:4000/post-json > "$RUNNER_TEMP/http-workflow-post-json.txt"
          grep --fixed-strings '"hello": "calcit"' "$RUNNER_TEMP/http-workflow-post-json.txt"
